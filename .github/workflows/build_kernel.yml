name: Build Galaxy J2 Kernel for Bluebinder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev git wget libncurses5-dev libelf-dev

      - name: Setup Toolchain (ARM 32-bit GCC)
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 toolchain

      - name: Configure and Build Kernel
        run: |
          export PATH=$PWD/toolchain/bin:$PATH
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=arm-linux-androideabi-
          
          make clean
          make mrproper
          
          make lineage-j2lte_defconfig
          
          echo "CONFIG_ANDROID_BINDER_IPC=y" >> .config
          echo "CONFIG_BT_VHCI=y" >> .config
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> .config
          
          make olddefconfig
          
          make -j$(nproc)
        shell: bash

      - name: Upload Compiled Kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: galaxy-j2-kernel-zImage
          path: arch/arm/boot/zImage
